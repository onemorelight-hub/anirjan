<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4e0"/>
      <stop offset="50%" stop-color="#f3c276"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </radialGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4deeea"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Cosmic Circle -->
  <circle cx="50" cy="50" r="46" fill="#05070c" stroke="url(#goldGlow)" stroke-width="2" />
  
  <!-- Orbiting Ellipse Ring -->
  <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="rgba(243, 194, 118, 0.4)" stroke-width="1.5" stroke-dasharray="3,3" transform="rotate(-20 50 50)" />
  
  <!-- Orbiting Planet Dot -->
  <circle cx="78" cy="40" r="4.5" fill="url(#orbGrad)" />
  
  <!-- Meditative Buddha Center Icon / Lotus Silhouette -->
  <g fill="url(#goldGlow)" transform="translate(25, 24) scale(0.5)">
    <!-- Ushnisha & Head -->
    <circle cx="50" cy="20" r="10" />
    <circle cx="50" cy="8" r="4" />
    <!-- Shoulders & Torso -->
    <path d="M50 34 C30 34 20 48 20 62 C20 70 30 76 50 76 C70 76 80 70 80 62 C80 48 70 34 50 34 Z" />
    <!-- Lotus Base -->
    <path d="M12 76 C12 76 30 92 50 92 C70 92 88 76 88 76 C70 82 50 82 12 76 Z" />
  </g>
</svg>
